<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW M4 — Build Yours</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; position: relative; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: white; transform: scale(1.1); }
        .color-btn.active::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
        
        .option-btn { border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .option-btn:hover { background: rgba(255,255,255,0.1); }
        .option-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        .form-input { width: 100%; bg-transparent; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 0.5rem; color: white; transition: all 0.3s; outline: none; }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body class="antialiased overflow-x-hidden pt-20">
    <div id="navbar-container"></div>

    <main>
        <!-- Hero -->
        <section class="py-16 px-4 text-center max-w-5xl mx-auto animate-fade-in">
            <h1 class="text-5xl md:text-7xl font-bold tracking-tighter mb-4 uppercase">
                Make it <span class="text-blue-500">Yours</span>
            </h1>
            <p class="text-xl text-gray-400 font-light max-w-2xl mx-auto">
                Configure your perfect BMW M4 and request more information.
            </p>
        </section>

        <!-- Configurator -->
        <section class="py-10 px-4 max-w-[1400px] mx-auto">
            <div class="flex flex-col xl:flex-row gap-12">
                
                <!-- Preview Area -->
                <div class="xl:w-2/3 animate-on-scroll">
                    <div class="sticky top-28 bg-[#0a0a0a] rounded-3xl overflow-hidden border border-white/10 shadow-2xl relative">
                        <div class="absolute top-6 left-6 z-10">
                            <h3 class="text-2xl font-bold uppercase tracking-widest" id="preview-model">BMW M4 Competition</h3>
                            <p class="text-sm text-gray-400" id="preview-color-text">Brooklyn Grey metallic</p>
                        </div>
                        <img src="images/hero.png" id="car-preview" alt="Configured BMW M4" class="w-full h-[50vh] xl:h-[70vh] object-cover transition-opacity duration-500">
                    </div>
                </div>

                <!-- Controls -->
                <div class="xl:w-1/3 animate-on-scroll" style="transition-delay: 100ms;">
                    <div class="glass-card rounded-3xl p-8 space-y-10">
                        
                        <!-- Exterior Color -->
                        <div>
                            <h4 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Exterior Color</h4>
                            <div class="flex flex-wrap gap-4" id="color-options">
                                <button class="color-btn active" style="background-color: #6a6c6e;" data-color="Brooklyn Grey metallic" data-filter="grayscale(20%) brightness(90%)"></button>
                                <button class="color-btn" style="background-color: #ffffff;" data-color="Alpine White" data-filter="grayscale(100%) brightness(150%)"></button>
                                <button class="color-btn" style="background-color: #050505;" data-color="Black Sapphire metallic" data-filter="grayscale(100%) brightness(30%)"></button>
                                <button class="color-btn" style="background-color: #1a365d;" data-color="Tanzanite Blue II metallic" data-filter="hue-rotate(220deg) brightness(60%) saturate(150%)"></button>
                                <button class="color-btn" style="background-color: #b91c1c;" data-color="Toronto Red metallic" data-filter="hue-rotate(340deg) brightness(80%) saturate(200%)"></button>
                                <button class="color-btn" style="background-color: #f59e0b;" data-color="Sao Paulo Yellow" data-filter="hue-rotate(40deg) brightness(120%) saturate(200%)"></button>
                            </div>
                        </div>

                        <!-- Wheels -->
                        <div>
                            <h4 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Wheels</h4>
                            <div class="space-y-3" id="wheel-options">
                                <button class="option-btn w-full active" data-wheel="19/20 M Forged Double-spoke">
                                    <span class="text-sm font-semibold">19"/20" M Forged Double-spoke</span>
                                    <div class="w-4 h-4 rounded-full border-2 border-current flex items-center justify-center p-[2px]">
                                        <div class="w-full h-full bg-current rounded-full"></div>
                                    </div>
                                </button>
                                <button class="option-btn w-full" data-wheel="19/20 M Forged Black">
                                    <span class="text-sm font-semibold">19"/20" M Forged Black</span>
                                    <div class="w-4 h-4 rounded-full border-2 border-current flex items-center justify-center p-[2px]">
                                        <div class="w-full h-full bg-current rounded-full hidden"></div>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <!-- Interior -->
                        <div>
                            <h4 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Interior Upholstery</h4>
                            <div class="space-y-3" id="interior-options">
                                <button class="option-btn w-full active" data-interior="Black Full Merino Leather">
                                    <span class="text-sm font-semibold flex items-center gap-3">
                                        <span class="w-6 h-6 rounded-md bg-[#111] inline-block border border-white/20"></span>
                                        Black Full Merino Leather
                                    </span>
                                </button>
                                <button class="option-btn w-full" data-interior="Kyalami Orange/Black Merino">
                                    <span class="text-sm font-semibold flex items-center gap-3">
                                        <span class="w-6 h-6 rounded-md bg-[#c25e24] inline-block border border-white/20"></span>
                                        Kyalami Orange/Black Merino
                                    </span>
                                </button>
                                <button class="option-btn w-full" data-interior="Silverstone/Black Merino">
                                    <span class="text-sm font-semibold flex items-center gap-3">
                                        <span class="w-6 h-6 rounded-md bg-[#e2e2e2] inline-block border border-white/20"></span>
                                        Silverstone/Black Merino
                                    </span>
                                </button>
                            </div>
                        </div>

                        <!-- Trim -->
                        <div>
                            <h4 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Trim</h4>
                            <div class="space-y-3" id="trim-options">
                                <button class="option-btn w-full active" data-trim="Carbon Fiber trim">
                                    <span class="text-sm font-semibold">Carbon Fiber trim</span>
                                </button>
                                <button class="option-btn w-full" data-trim="Aluminum Rhombicle Anthracite">
                                    <span class="text-sm font-semibold">Aluminum Rhombicle Anthracite</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </section>

        <!-- Contact Form -->
        <section class="py-24 px-4 max-w-4xl mx-auto border-t border-white/5">
            <div class="text-center mb-12 animate-on-scroll">
                <h2 class="text-4xl font-bold mb-4 uppercase">Request Information</h2>
                <p class="text-gray-400">Your configuration will be sent to your selected BMW dealer.</p>
            </div>
            
            <form class="glass-card p-8 md:p-12 rounded-3xl animate-on-scroll shadow-2xl" id="contact-form" onsubmit="event.preventDefault(); alert('Thank you for your interest! Your configuration has been saved (Concept Demo Only).');">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div>
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" required placeholder="John Doe">
                    </div>
                    <div>
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" required placeholder="john@example.com">
                    </div>
                </div>
                
                <div class="mb-8">
                    <label class="form-label">Country / Region</label>
                    <select class="form-input appearance-none text-gray-300" required>
                        <option value="">Select your country...</option>
                        <option value="us">United States</option>
                        <option value="uk">United Kingdom</option>
                        <option value="de">Germany</option>
                        <option value="ae">United Arab Emirates</option>
                        <option value="au">Australia</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="mb-8">
                    <label class="form-label">Message (Optional)</label>
                    <textarea class="form-input h-32 resize-none" placeholder="I would like to schedule a test drive..."></textarea>
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-800 text-white font-bold rounded-xl hover:shadow-lg hover:shadow-blue-500/50 transition-all uppercase tracking-widest">
                    Submit Request
                </button>
            </form>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="components.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const previewImg = document.getElementById('car-preview');
            const colorText = document.getElementById('preview-color-text');
            
            // Color selection (Uses CSS filters to fake color change on the base image)
            const colorBtns = document.querySelectorAll('.color-btn');
            colorBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    colorBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const filter = btn.getAttribute('data-filter');
                    const colorName = btn.getAttribute('data-color');
                    
                    previewImg.style.opacity = 0;
                    setTimeout(() => {
                        previewImg.style.filter = filter;
                        colorText.innerText = colorName;
                        previewImg.style.opacity = 1;
                    }, 300);
                });
            });

            // Option selection (Wheels, Interior, Trim)
            const setupOptions = (containerId) => {
                const btns = document.querySelectorAll(`#${containerId} .option-btn`);
                btns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        btns.forEach(b => {
                            b.classList.remove('active');
                            const indicator = b.querySelector('.bg-current');
                            if(indicator) indicator.classList.add('hidden');
                        });
                        btn.classList.add('active');
                        const indicator = btn.querySelector('.bg-current');
                        if(indicator) indicator.classList.remove('hidden');
                    });
                });
            };

            setupOptions('wheel-options');
            setupOptions('interior-options');
            setupOptions('trim-options');
        });
    </script>
</body>
</html>
